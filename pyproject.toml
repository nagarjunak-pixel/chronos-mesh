[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "chronos-mesh"
version = "1.0.0"
description = "Supply-chain rerouting toy model — pure-Python simplex + branch-and-bound MILP, BOM safety stock, Monte Carlo CVaR95. Educational reference implementation"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "Nagarjuna Kamireddy", email = "sendemailtonagarjuna@gmail.com" },
]
keywords = [
  "neuro-symbolic-ai",
  "supply-chain-optimization",
  "operations-research",
  "milp",
  "branch-and-bound",
  "digital-twin",
  "monte-carlo-cvar",
  "enterprise-erp",
]
dependencies = [
  "pydantic>=2.7.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "hypothesis>=6.100.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[project.scripts]
chronos = "chronos_mesh.cli:app"

[project.urls]
Homepage = "https://github.com/nagarjunak-pixel/chronos-mesh"
Repository = "https://github.com/nagarjunak-pixel/chronos-mesh"

[tool.hatch.build.targets.wheel]
packages = ["src/chronos_mesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
